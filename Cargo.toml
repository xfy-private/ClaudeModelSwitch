[package]
name = "claude-relay"
version = "0.1.0"
edition = "2021"
description = "Claude Code 多服务商多模型动态切换中转服务（Anthropic 协议纯透传）"

[dependencies]
# Web 服务器：仅 http1，裁剪 http2/ws/form 等
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio", "query"] }
# 运行时：单线程 current_thread（空闲内存几 MB）
tokio = { version = "1", features = ["rt", "net", "io-util", "sync", "time"] }
# HTTP 客户端：rustls 而非 OpenSSL（避免大依赖）；json feature 供桌面卡片取余额/用量
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bytes = "1"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
# Phase 28：读浏览器（Chrome/Edge）Cookie 数据库（SQLite WAL 模式 → bundled 最稳）。
# bundled 需 C 编译器（TDM-GCC），首个 C 编译依赖，exe +~1MB（总量仍 <6MB）。
rusqlite = { version = "0.32", features = ["bundled"] }
# Cookie 解密：v10 前缀 = 3B + 12B nonce + AES-128-GCM 密文（key = DPAPI 解出的 32B 前 16B）
aes-gcm = { version = "0.10", default-features = false, features = ["aes", "alloc"] }
# 解 Local State 里 os_crypt.encrypted_key 的 base64
base64 = "0.22"

[target.'cfg(windows)'.dependencies]
# 系统托盘（仅 Windows；菜单经 tray-icon 的 menu 模块/muda 提供）
tray-icon = "0.20"
# Windows 消息泵：托盘隐藏窗口需要 GetMessage/DispatchMessage 处理 WM_TRAYICON/WM_COMMAND；
# Win32_System_Console：GetConsoleProcessList/GetConsoleWindow（双击隐藏黑框）；
# Win32_System_Registry：开机自启 HKCU Run 键
# GDI+（Win32_Graphics_GdiPlus）：桌面卡片用 GDI+ 抗锯齿圆角/渐变/AA 文字绘制
#   （系统 gdiplus.dll，仅绑定，不增 exe 体积）。
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_UI_HiDpi", "Win32_System_Com", "Win32_System_Console", "Win32_System_Registry", "Win32_System_LibraryLoader", "Win32_System_Time", "Win32_Security", "Win32_Security_Cryptography", "Win32_System_Memory", "Win32_Graphics_Gdi", "Win32_Graphics_GdiPlus"] }

[profile.release]
opt-level = "z"        # 体积优先
lto = true
codegen-units = 1
panic = "abort"
strip = true
